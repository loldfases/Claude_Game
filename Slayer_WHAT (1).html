<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slayer_WHAT</title>
<style>
:root{--bg:#efe9dc;--pn:#fffaf0;--tx:#1d1a24;--ac:#e0553a;--bd:#d8cfbd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121b;--pn:#221f2e;--tx:#f1ecff;--bd:#3a3550}}
:root[data-theme="dark"]{--bg:#14121b;--pn:#221f2e;--tx:#f1ecff;--bd:#3a3550}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,"Segoe UI",sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:1400px;padding:10px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
h1{margin:0 0 8px;font-size:26px;letter-spacing:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s{background:#4b5a86}button:disabled{opacity:.4;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;margin:8px 0}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#dots{display:flex;gap:4px}#dots i{width:14px;height:14px;border-radius:50%;background:var(--bd)}
#dots i.on{background:#3fae5a}#dots i.b{border-radius:4px;outline:2px solid #e0a82a}#dots i.b.on{background:#e0a82a}
#scene{position:relative;height:clamp(320px,56vh,640px);border-radius:14px;overflow:hidden;margin:10px 0;border:1px solid var(--bd);transition:background .6s;box-shadow:inset 0 -60px 80px #0005}
#scene::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 50%,#000a 100%);pointer-events:none;z-index:6}
#bg{position:absolute;inset:0}
.shk{animation:shk .25s}@keyframes shk{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
.slash{position:absolute;top:38%;width:100px;height:4px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 14px 4px #fff;transform:rotate(-35deg);animation:sl .3s forwards;z-index:5}
@keyframes sl{from{opacity:1;transform:rotate(-35deg) scaleX(.2)}to{opacity:0;transform:rotate(-35deg) scaleX(1.5)}}
.pt{position:absolute;top:-10%;font-size:14px;opacity:.7;animation:fl 6s linear infinite}
@keyframes fl{to{transform:translate(-70px,360px) rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-5px)}}
#hst{min-height:28px;text-shadow:0 2px 3px #000}.stt{background:#000b;border-radius:10px;padding:1px 7px;margin:0 2px;font-size:15px;color:#fff;display:inline-block;animation:pl 1s infinite alternate}@keyframes pl{to{transform:scale(1.15)}}
.sh{position:absolute;left:15%;width:70%;height:14px;bottom:-6px;background:radial-gradient(#000a,transparent 70%);z-index:-1}
.sp svg{height:150px;display:block;margin:auto}
#hw{position:absolute;right:4%;top:48%;font-size:38px;transform:rotate(25deg);filter:drop-shadow(0 2px 2px #0008)}
.d{position:absolute;opacity:.95;filter:drop-shadow(0 5px 3px #0007)}
.cl{position:absolute;top:8%;font-size:40px;opacity:.8;animation:dr 40s linear infinite}
@keyframes dr{from{left:-15%}to{left:110%}}
.f{position:absolute;bottom:9%;text-align:center;width:42%;z-index:3;animation:bob 2.4s ease-in-out infinite}#en{animation-delay:-1.1s}
#hero{left:4%}#en{right:4%}
.sp{font-size:110px;line-height:1;transition:transform .15s;filter:drop-shadow(0 8px 5px #000a) saturate(1.15) contrast(1.05)}
.sp.hit{animation:sh .3s}.sp.atk{transform:translateX(30px)}#en .sp.atk{transform:translateX(-30px)}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.nm{font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000;margin-bottom:4px;background:#000b;padding:4px 8px;border-radius:8px;display:inline-block;line-height:1.3}.nm small{font-weight:600;font-size:11px;color:#e8e2ff}
.bar{height:10px;background:#0006;border-radius:6px;overflow:hidden;margin:3px auto;width:80%}
.bar i{display:block;height:100%;background:#4ade80;transition:width .3s}#eb i{background:#f87171}
.pop{position:absolute;left:40%;top:-6px;font-weight:800;font-size:24px;text-shadow:0 2px 3px #000;animation:up .9s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
#log{height:120px;overflow:auto;font-size:14px}#log p{margin:2px 0}
#acts{display:flex;flex-wrap:wrap;gap:8px}
#st{font-size:13px;display:flex;gap:12px;flex-wrap:wrap}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
#modal .card{max-width:420px;width:100%;max-height:85vh;overflow:auto;margin:0}
.it{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.hide{display:none}
</style></head><body><div id="app">

<section id="intro" class="card"><button class="s" onclick="fs()" style="float:right">⛶ Pantalla completa</button>
<h1>⚔️ SLAYER_WHAT</h1>
<p id="ty" style="min-height:70px"></p>
<div id="ia"></div>
</section>

<section id="game" class="hide">
<div class="card"><header><b id="bn"></b><div id="dots"></div><button class="s" onclick="fs()" title="Pantalla completa">⛶</button><button class="s" id="admb">🛠️ Admin</button><button class="s" id="bagb">🎒 Mochila</button></header>
<div id="scene">
<div id="bg"></div><div id="sky"></div><div id="deco"></div><div id="fx"></div>
<div class="f" id="hero"><div class="nm" id="hn"></div><div class="bar"><i id="hbi"></i></div><div id="hst"></div><div class="sp" id="hs"><svg viewBox="0 0 80 110"><defs><linearGradient id="mt" x1="0" x2="1"><stop offset="0" stop-color="#e3e8f2"/><stop offset="1" stop-color="#6b7790"/></linearGradient></defs><rect x="26" y="78" width="12" height="28" rx="4" fill="#3a3f55"/><rect x="42" y="78" width="12" height="28" rx="4" fill="#33384c"/><path d="M20 40Q40 32 60 40L56 82H24Z" fill="url(#mt)"/><rect x="24" y="70" width="32" height="6" fill="#7b4a1e"/><circle cx="40" cy="26" r="15" fill="url(#mt)"/><rect x="32" y="22" width="16" height="5" fill="#1a1d2b"/><path d="M40 11Q52 2 58 14Q46 12 40 11Z" fill="#d1352b"/><rect x="56" y="42" width="8" height="24" rx="4" fill="#9aa6bd"/><path d="M4 44h20v20Q14 78 4 64Z" fill="#2f5fb0" stroke="#e0b84a" stroke-width="2"/></svg></div><span id="hw"></span><div class="sh"></div></div>
<div class="f" id="en"><div class="nm" id="enn"></div><div class="bar" id="eb"><i id="ebi"></i></div><div class="sp" id="es"></div><div class="sh"></div></div>
</div>
<div id="st"></div></div>
<div class="card" id="log"></div>
<div class="card" id="acts"></div>
</section>
<div id="modal"><div class="card" id="mc"></div></div>
</div>
<script>
const $=i=>document.getElementById(i),rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const B=[
{n:'🌿 El Prado',bg:'linear-gradient(#8fd3ff 0%,#d6f1ff 50%,#6fc25a 50%,#3f8f37 100%)',dc:['🌳','🌾','🌼','🌳','🌾','🍄'],sky:'☁️',
boss:{n:'Minotauro',e:'🐂',hp:150,d:14},
pool:[{n:'Slime',e:'🟢',hp:20,d:4},{n:'Goblins',e:'👺',hp:30,d:6},{n:'Gremlin',e:'😈',hp:20,d:4,g:[2,3]},{n:'Esqueleto caballero',e:'💀',hp:20,d:14},{n:'Esqueleto arquero',e:'🏹',hp:35,d:7,dg:25},{n:'Orco',e:'👹',hp:40,d:9},{n:'Caballero zombi',e:'🧟',hp:50,d:8},{n:'Zombi mutado',e:'🧟‍♂️',hp:35,d:7,t:'boom'},{n:'Gigante bebé',e:'👶',hp:45,d:10},{n:'Golem bebé',e:'🗿',hp:55,d:6},{n:'Bruja',e:'🧙‍♀️',hp:30,d:6,t:'poison'},{n:'Bandidos',e:'🥷',hp:25,d:6,g:[1,3]}]},
{n:'🌲 Bosque Oscuro',bg:'linear-gradient(#1c2b3a 0%,#2f4a46 50%,#1d3a24 50%,#0f2415 100%)',dc:['🌲','🌲','🍂','🌲','🪵','🌲'],sky:'🌙',
boss:{n:'Reina Araña',e:'🕷️',hp:150,d:14,t:'poison'},
pool:[{n:'Lobo',e:'🐺',hp:30,d:8,dg:12},{n:'Murciélagos',e:'🦇',hp:20,d:5,dg:30,g:[2,3]},{n:'Araña',e:'🕷️',hp:28,d:6,t:'poison'},{n:'Ent joven',e:'🌳',hp:60,d:8},{n:'Hada oscura',e:'🧚',hp:25,d:7,t:'poison',dg:20},{n:'Troll',e:'🧌',hp:55,d:11}]},
{n:'🏜️ Desierto Ardiente',bg:'linear-gradient(#ffb86b 0%,#ffe3a3 50%,#e3b365 50%,#b8843c 100%)',dc:['🌵','🪨','🌵','🦴','🌵','🏺'],sky:'☀️',
boss:{n:'Faraón Maldito',e:'🏺',hp:160,d:15},
pool:[{n:'Escorpión',e:'🦂',hp:30,d:7,t:'poison'},{n:'Cobra',e:'🐍',hp:28,d:7,t:'poison',dg:15},{n:'Momia',e:'🧟‍♀️',hp:50,d:9},{n:'Golem de arena',e:'🗿',hp:65,d:8},{n:'Buitre',e:'🦅',hp:25,d:8,dg:30},{n:'Genio',e:'🧞',hp:40,d:11,dg:15}]},
{n:'🌋 Cráter del Volcán',bg:'linear-gradient(#3a0d0d 0%,#7a2410 50%,#3b1208 50%,#1a0805 100%)',dc:['🔥','🪨','🌋','🔥','🪨','🔥'],sky:'☄️',
boss:{n:'Dragón Ancestral',e:'🐉',hp:200,d:17},
pool:[{n:'Demonio',e:'👿',hp:45,d:11},{n:'Elemental de fuego',e:'🔥',hp:40,d:10,t:'poison'},{n:'Slime de lava',e:'🟠',hp:50,d:9,t:'boom'},{n:'Dragón bebé',e:'🐲',hp:55,d:12},{n:'Gólem de obsidiana',e:'🗿',hp:80,d:9},{n:'Diablillos',e:'😈',hp:25,d:7,g:[2,3]}]}];
const HM=[1,1.6,2.4,3.4],DM=[1,1.5,2.1,2.8];
const TN={C:'Cortante',P:'Perforante',B:'Contundente',D:'A distancia',M:'Mágica'},EFL={1.5:'eficaz',1:'neutro',.6:'débil'};
const EF={'Slime':['M','P'],'Goblins':['C','M'],'Gremlin':['D','B'],'Esqueleto caballero':['B','C'],'Esqueleto arquero':['B','D'],'Orco':['P','C'],'Caballero zombi':['M','D'],'Zombi mutado':['D','B'],'Gigante bebé':['P','B'],'Golem bebé':['B','P'],'Bruja':['C','M'],'Bandidos':['D','B'],'Lobo':['P','C'],'Murciélagos':['M','B'],'Araña':['M','P'],'Ent joven':['C','D'],'Hada oscura':['P','M'],'Troll':['M','B'],'Escorpión':['B','P'],'Cobra':['C','D'],'Momia':['M','C'],'Golem de arena':['B','P'],'Buitre':['D','B'],'Genio':['P','M'],'Demonio':['C','M'],'Elemental de fuego':['D','M'],'Slime de lava':['B','M'],'Dragón bebé':['P','M'],'Gólem de obsidiana':['B','C'],'Diablillos':['D','M'],'Minotauro':['P','B'],'Reina Araña':['M','P'],'Faraón Maldito':['M','C'],'Dragón Ancestral':['P','M']};
const WT={'Puños':'B','Espada de madera':'C','Arco de madera':'D','Espada':'C','Espada rota':'C','Arco roto':'D','Espada de diamante':'C','Arco de metal':'D','Hacha de guerra':'C','Daga afilada':'P','Lanza':'P','Ballesta':'D','Martillo del trueno':'M','Katana':'C','Sable pirata':'C','Maza de hierro':'B','Tridente marino':'P','Arco largo':'D','Guadaña':'C','Espada de fuego':'M','Bastón de hielo':'M','Estoque real':'P','Excalibur':'C','Arco de la luna':'D','Espada del dragón':'M','Guadaña del Segador':'C'};
const eff=(w,e)=>{const k=EF[e.k]||[],t=WT[w.n]||'C';return t==k[0]?1.5:t==k[1]?.6:1};
let S;
const bi=()=>Math.min(B.length-1,Math.floor(S.kills/10));
function typ(t,cb){const el=$('ty');let i=0;(function f(){el.textContent=t.slice(0,i++);i<=t.length?setTimeout(f,22):cb&&cb()})()}
function ia(arr){$('ia').innerHTML='';arr.forEach(([l,f,c])=>{const b=document.createElement('button');b.textContent=l;if(c)b.className=c;b.onclick=f;$('ia').appendChild(b);$('ia').append(' ')})}
function intro(){$('ia').innerHTML='';typ('Bienvenido a Slayer_WHAT. El juego está en desarrollo, ¡disfruta del contenido! Antes de empezar lo más importante: el nombre de tu personaje.',()=>{
$('ia').innerHTML='<input id="nin" maxlength="16" placeholder="Tu nombre…"><button id="nb">Continuar</button>';
$('nb').onclick=()=>{const n=$('nin').value.trim()||'Héroe';init(n);
typ('Bienvenido '+n+'. Te iré diciendo lo que puedes hacer y lo que no, ¿vale? Si ya sabes jugar, elige VeteranPlayer.',()=>ia([['Vale',tut],['VeteranPlayer',start,'s']]))}})}
function tut(){typ('Este juego va sobre ERECCIONES… my bad, quise decir ELECCIONES. En el camino encontrarás cofres, enemigos y nuevos biomas. Cada 10 enemigos cambias de bioma, y el décimo es el JEFE. Ataca, esquiva, bebe pociones o cambia de arma (¡pero el enemigo te golpea mientras tanto!). Objetivo: sobrevivir a esta locura de mundo.',()=>ia([['¡A jugar!',start]]))}
function init(n){S={name:n,lvl:1,xp:0,hp:100,mx:100,pot:1,bag:[],w:{n:'Puños',d:7},kills:0,dod:false,busy:false,e:null}}
function start(){if(!S)init('Héroe');$('intro').classList.add('hide');$('game').classList.remove('hide');$('hn').textContent=S.name;
$('bagb').onclick=()=>bag(false);$('admb').onclick=admin;
L('Estás en un prado muy llano, con hierba alta. Te encuentras un cofre con bastante mala pinta.');
acts([['📦 Abrir cofre',()=>chest(next)],['Ignorarlo',()=>{L('Te quedas sin saber qué había… a puño limpio, campeón.');next()}]]);setBiome()}
function L(t,c){const l=$('log'),p=document.createElement('p');p.textContent=t;if(c)p.style.color=c;l.appendChild(p);l.scrollTop=1e9}
function acts(a){$('acts').innerHTML='';a.forEach(([l,f,d])=>{const b=document.createElement('button');b.textContent=l;if(d)b.disabled=true;b.onclick=f;$('acts').appendChild(b)})}
const MC=[['#7fa6c9','#5f9a7a','#3f7a45'],['#1b2733','#16241f','#0e1a12'],['#d99a55','#c07f3e','#a56a2c'],['#2a0a0a','#4a150a','#220804']],PT=['🍃','🍂','·','✦'];
function mt(i){const c=MC[i];return `<svg viewBox="0 0 400 250" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><path d="M0 130L50 80L95 120L150 60L210 125L270 75L330 120L400 70V160H0Z" fill="${c[0]}" opacity=".85"/><path d="M0 150Q60 105 130 140T270 135T400 140V170H0Z" fill="${c[1]}"/><path d="M0 170Q100 140 200 165T400 155V250H0Z" fill="${c[2]}"/></svg>`}
function fg(i){const g=GLS[i];return `<svg viewBox="0 0 400 250" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%"><defs><radialGradient id="gl"><stop offset="0" stop-color="${g}" stop-opacity=".95"/><stop offset="1" stop-color="${g}" stop-opacity="0"/></radialGradient><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient></defs><circle cx="320" cy="55" r="70" fill="url(#gl)"/><rect y="115" width="400" height="40" fill="url(#fg)"/><rect y="150" width="400" height="100" fill="url(#gd)"/><path d="M0 200H400M0 225H400M200 160L40 250M200 160L160 250M200 160L240 250M200 160L360 250" stroke="#000" stroke-opacity=".12" fill="none"/><path d="M0 250V225Q20 205 45 230Q60 215 80 250Z" fill="#000" opacity=".55"/><path d="M400 250V228Q375 205 350 232Q335 220 320 250Z" fill="#000" opacity=".55"/></svg>`}
function setBiome(){const b=B[bi()];$('bg').innerHTML=mt(bi())+fg(bi());$('scene').style.background=b.bg;$('bn').textContent=b.n;
$('deco').innerHTML=b.dc.map((x,i)=>`<span class="d" style="left:${i*17+3}%;bottom:${34+i%3*6}%;font-size:${44+i%3*16}px">${x}</span>`).join('');
$('sky').innerHTML=[0,1,2].map(i=>`<span class="cl" style="animation-delay:-${i*13}s;top:${6+i*9}%">${b.sky}</span>`).join('')+Array.from({length:8},(_,k)=>`<span class="pt" style="left:${k*13+4}%;animation-delay:-${k*.8}s">${PT[bi()]}</span>`).join('')}
function effTxt(e){const k=EF[e.k]||[],t=WT[S.w.n]||'C';return '🎯 Débil a: '+(TN[k[0]]||'-')+' · 🛡️ Resiste: '+(TN[k[1]]||'-')+'<br>Tu arma ('+TN[t]+'): <b>'+EFL[eff(S.w,e)].toUpperCase()+'</b>'}
function statsHTML(e){const tr=trT(e),tr0=e.boss?' · 💢 pesado c/3':e.t=='poison'?' · ☠️ veneno':e.t=='boom'?' · 💥 explota':'';return e.nm+'<br><small>❤️ '+Math.max(0,e.hp)+'/'+e.mx+' · ⚔️ '+e.d+' · 💨 '+e.dg+'%'+tr+'<br>'+effTxt(e)+'</small>'}
function render(){const e=S.e;$('hst').innerHTML=(S.ps>0?'<span class="stt">'+(S.st=='quemadura'?'🔥 Quemado':'☠️ Envenenado')+' '+S.ps+'</span>':'')+(S.stun?'<span class="stt">💫 Aturdido</span>':'');$('hn').innerHTML=S.name+'<br><small>❤️ '+S.hp+'/'+S.mx+' · ⚔️ '+dmg()+' · 💨 '+(8+(S.dod?35:0))+'%</small>';$('hw').textContent=S.w.i||(S.w.b?'🏹':S.w.n=='Puños'?'👊':'🗡️');$('hbi').style.width=Math.max(0,S.hp/S.mx*100)+'%';
if(e){$('ebi').style.width=Math.max(0,e.hp/e.mx*100)+'%';$('enn').innerHTML=statsHTML(e)+(e.ps?' ☠️':'');$('es').textContent=e.e.repeat(e.cnt);$('es').style.fontSize=e.cnt>1?'70px':e.boss?'150px':'105px'}else{$('enn').textContent='';$('es').textContent='';$('ebi').style.width=0}
const f=S.kills%10;$('dots').innerHTML=Array.from({length:10},(_,i)=>`<i class="${i<f?'on':''} ${i==9?'b':''}"></i>`).join('');
$('st').innerHTML=`<span>❤️ ${S.hp}/${S.mx}</span><span>⭐ Nv ${S.lvl}</span><span>✨ XP ${S.xp}/${need()}</span><span>🧪 ${S.pot}</span><span>⚔️ ${S.w.n} (${dmg(1)})</span><span>☠️ ${S.kills}</span>`+(S.ps?'<span>☠️ Envenenado</span>':'')}
const need=()=>100+(S.lvl-1)*30;const dmg=r=>S.w.d+(S.lvl-1)*3;
function slash(id){const x=document.createElement('div');x.className='slash';x.style.left=id=='es'?'68%':'18%';$('fx').appendChild(x);setTimeout(()=>x.remove(),350)}
function shake(){const s=$('scene');s.classList.remove('shk');void s.offsetWidth;s.classList.add('shk')}
function pop(id,t,c){const s=document.createElement('span');s.className='pop';s.style.color=c;s.textContent=t;$(id).appendChild(s);setTimeout(()=>s.remove(),900)}
function hit(id){const s=$(id);slash(id);shake();s.classList.add('hit');setTimeout(()=>s.classList.remove('hit'),300)}
function next(){S.e=null;
if(S.kills>0&&S.kills%10==0&&!S.shown){S.shown=1;const b=B[bi()];setBiome();render();L('🌍 ¡Llegas a un nuevo bioma: '+b.n+'! ¡Cuidado, aquí nadie te cura!','#e0a82a')}
else S.shown=0;
render();acts([['🧭 Avanzar',spawn],['🏕️ Descansar (40% curación total)',rest]])}
function rest(){acts([]);if(rnd(1,100)<=40){S.hp=S.mx;S.ps=0;S.stun=0;render();pop('hero','¡Curado!','#4ade80');L('🏕️ Descansas plácidamente y recuperas toda la vida.','#4ade80');acts([['🧭 Avanzar',spawn],['🏕️ Descansar (40% curación total)',rest]])}else{const b=B[bi()];L('🏕️ Intentas descansar, pero ¡te emboscan!','#f87171');spawn([bi(),b.pool[rnd(0,b.pool.length-1)],0])}}
